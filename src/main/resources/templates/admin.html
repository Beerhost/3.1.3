<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Admin panel</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-size: 1.25rem;
        }

        .topbar {
            min-height: 60px;
            background-color: #343a40;
            color: #ffffff;
        }

        .topbar strong {
            font-weight: 700;
        }

        .topbar .logout {
            color: rgba(255, 255, 255, .6);
        }

        .sidebar {
            min-height: calc(100vh - 60px);
            background-color: #ffffff;
            padding-top: 20px;
        }

        .sidebar .nav-link {
            border-radius: 4px;
            padding: 12px 20px;
        }

        .content {
            padding: 24px 38px;
        }

        h1 {
            font-size: 3.25rem;
            font-weight: 400;
            margin-bottom: 20px;
        }

        .card-header {
            font-size: 1.55rem;
            font-weight: 600;
            background-color: #f7f7f7;
        }

        .table th,
        .table td {
            padding: 16px;
            vertical-align: middle;
        }

        .user-form {
            max-width: 390px;
            margin: 26px auto;
            text-align: center;
        }

        .user-form label {
            font-weight: 700;
            margin-bottom: 0;
        }

        .user-form .form-control {
            margin-bottom: 22px;
        }

        .modal-form {
            max-width: 260px;
            margin: 0 auto;
            text-align: center;
        }

        .modal-form label {
            font-weight: 700;
            margin-bottom: 2px;
        }

        .modal-form .form-control {
            margin-bottom: 22px;
        }

        .modal-form select.form-control {
            min-height: 66px;
        }
    </style>
</head>
<body>
<nav class="topbar d-flex align-items-center justify-content-between px-4">
    <div>
        <strong th:text="${currentUser.email}">admin@mail.ru</strong>
        <span> with roles: </span>
        <span th:each="role, iterStat : ${currentUser.roles}"
              th:text="${#strings.replace(role.name, 'ROLE_', '') + (iterStat.last ? '' : ' ')}">ADMIN</span>
    </div>
    <form th:action="@{/logout}" method="post" class="m-0">
        <button type="submit" class="btn btn-link logout p-0">Logout</button>
    </form>
</nav>

<div class="container-fluid">
    <div class="row">
        <aside class="col-2 sidebar px-0">
            <nav class="nav flex-column">
                <a class="nav-link active bg-primary text-white" th:href="@{/admin}">Admin</a>
                <a class="nav-link" th:href="@{/user}">User</a>
            </nav>
        </aside>

        <main class="col-10 content">
            <h1>Admin panel</h1>

            <ul class="nav nav-tabs" id="adminTabs" role="tablist">
                <li class="nav-item">
                    <a class="nav-link active" id="users-tab" data-toggle="tab" href="#users-table"
                       role="tab" aria-controls="users-table" aria-selected="true">Users table</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="new-user-tab" data-toggle="tab" href="#new-user"
                       role="tab" aria-controls="new-user" aria-selected="false">New User</a>
                </li>
            </ul>

            <div class="tab-content" id="adminTabsContent">
                <section class="tab-pane fade show active" id="users-table" role="tabpanel"
                         aria-labelledby="users-tab">
                    <div class="card">
                        <div class="card-header">All users</div>
                        <div class="card-body">
                            <table class="table table-striped">
                                <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>First Name</th>
                                    <th>Last Name</th>
                                    <th>Age</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Edit</th>
                                    <th>Delete</th>
                                </tr>
                                </thead>
                                <tbody id="usersTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </section>

                <section class="tab-pane fade" id="new-user" role="tabpanel" aria-labelledby="new-user-tab">
                    <div class="card">
                        <div class="card-header">Add new user</div>
                        <div class="card-body">
                            <form class="user-form" id="newUserForm">
                                <label for="firstName">First name</label>
                                <input type="text" class="form-control" id="firstName" name="firstName" required>

                                <label for="lastName">Last name</label>
                                <input type="text" class="form-control" id="lastName" name="lastName" required>

                                <label for="age">Age</label>
                                <input type="number" class="form-control" id="age" name="age" required>

                                <label for="email">Email</label>
                                <input type="email" class="form-control" id="email" name="email" required>

                                <label for="password">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>

                                <label for="roles">Role</label>
                                <select multiple class="form-control roles-select" id="roles" name="roles" size="2" required></select>

                                <button type="submit" class="btn btn-success btn-lg mt-3">Add new user</button>
                            </form>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <form class="modal-content" id="editUserForm">
            <div class="modal-header">
                <h5 class="modal-title">Edit user</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-form">
                    <input type="hidden" id="editId" name="id">

                    <label for="editIdView">ID</label>
                    <input type="text" class="form-control" id="editIdView" disabled>

                    <label for="editFirstName">First name</label>
                    <input type="text" class="form-control" id="editFirstName" name="firstName" required>

                    <label for="editLastName">Last name</label>
                    <input type="text" class="form-control" id="editLastName" name="lastName" required>

                    <label for="editAge">Age</label>
                    <input type="number" class="form-control" id="editAge" name="age" required>

                    <label for="editEmail">Email</label>
                    <input type="email" class="form-control" id="editEmail" name="email" required>

                    <label for="editPassword">Password</label>
                    <input type="password" class="form-control" id="editPassword" name="password">

                    <label for="editRoles">Role</label>
                    <select multiple class="form-control roles-select" id="editRoles" name="roles" size="2"></select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                <button type="submit" class="btn btn-primary">Edit</button>
            </div>
        </form>
    </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <form class="modal-content" id="deleteUserForm">
            <div class="modal-header">
                <h5 class="modal-title">Delete user</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-form">
                    <input type="hidden" id="deleteId" name="id">

                    <label for="deleteIdView">ID</label>
                    <input type="text" class="form-control" id="deleteIdView" disabled>

                    <label for="deleteFirstName">First name</label>
                    <input type="text" class="form-control" id="deleteFirstName" disabled>

                    <label for="deleteLastName">Last name</label>
                    <input type="text" class="form-control" id="deleteLastName" disabled>

                    <label for="deleteAge">Age</label>
                    <input type="number" class="form-control" id="deleteAge" disabled>

                    <label for="deleteEmail">Email</label>
                    <input type="email" class="form-control" id="deleteEmail" disabled>

                    <label for="deleteRoles">Role</label>
                    <select multiple class="form-control roles-select" id="deleteRoles" size="2" disabled></select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                <button type="submit" class="btn btn-danger">Delete</button>
            </div>
        </form>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
