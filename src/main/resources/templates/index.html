<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Login page</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .login-form {
            max-width: 390px;
            margin: 64px auto 0;
        }

        .login-form h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 16px;
            text-align: center;
        }

        .login-form .form-control {
            height: 48px;
            font-size: 1.25rem;
        }

        .login-form .form-control:first-of-type {
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
        }

        .login-form .form-control:last-of-type {
            border-top-left-radius: 0;
            border-top-right-radius: 0;
            margin-top: -1px;
        }

        .login-form .btn {
            margin-top: 10px;
            padding: 10px 0;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
<main class="container">
    <form class="login-form" th:action="@{/login}" method="post">
        <h1>Please sign in</h1>
        <div th:if="${param.error}" class="alert alert-danger py-2">Invalid email or password</div>
        <div th:if="${param.logout}" class="alert alert-success py-2">You have been logged out</div>
        <input type="text" name="username" class="form-control" placeholder="Email address" autofocus required>
        <input type="password" name="password" class="form-control" placeholder="Password" required>
        <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
